<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CallPilot – AI that calls, qualifies, and follows up for your business.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CallPilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CallPilot – Your AI Calling Employee</title>
  <link rel="manifest" href="manifest.json">
</head>
  <script>
    let activeAudioEl = null;
    let cachedVoices = [];

    function updateVoices() {
      if ('speechSynthesis' in window) {
        const v = window.speechSynthesis.getVoices();
        if (v && v.length) cachedVoices = v;
      }
    }
    if ('speechSynthesis' in window) {
      updateVoices();
      window.speechSynthesis.onvoiceschanged = updateVoices;
    }

    window.playBase64Audio = function(base64Audio) {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if (!base64Audio) return;
        const mime = (base64Audio.startsWith('//') || base64Audio.startsWith('SUQz')) ? 'audio/mpeg' : 'audio/wav';
        const audio = new Audio(`data:${mime};base64,` + base64Audio);
        activeAudioEl = audio;
        audio.play().catch(e => {
          console.warn('Audio play error, retrying audio/mpeg:', e);
          const fallback = new Audio("data:audio/mpeg;base64," + base64Audio);
          activeAudioEl = fallback;
          fallback.play().catch(e2 => console.warn('Audio retry error:', e2));
        });
      } catch (e) {
        console.warn('playBase64Audio error:', e);
      }
    };

    window.speakAgentText = function(text) {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        // De-dramatize: replace exclamation marks with neutral sentence endings
        const cleanText = (text || '').replace(/!+/g, '.').trim();
        if (!cleanText) return;

        function isMale(name) {
          const n = (name || '').toLowerCase();
          const maleKeywords = [
            'aman', 'rishi', 'daniel', 'fred', 'alex', 'david', 'mark', 'george',
            'oliver', 'arthur', 'eddy', 'reed', 'rocko', 'ralph', 'albert', 'guy',
            'male', 'bad news', 'bahh', 'bells', 'boing', 'bubbles', 'cellos',
            'jester', 'junior', 'organ', 'superstar', 'trinoids', 'whisper', 'zarvox',
            'ravi', 'pradeep', 'karan'
          ];
          return maleKeywords.some(m => n.includes(m));
        }

        function selectFemaleVoice() {
          updateVoices();
          const voices = cachedVoices.length ? cachedVoices : (window.speechSynthesis.getVoices() || []);
          if (!voices.length) return null;

          // 1. Primary: Indian English / Indic Female voices (Tara on macOS, Heera/Neerja on Windows)
          const indianFemaleNames = ['tara', 'veena', 'heera', 'neerja', 'lekha', 'priya', 'aditi'];
          for (const target of indianFemaleNames) {
            const match = voices.find(v => v.name.toLowerCase().includes(target));
            if (match) return match;
          }

          // Check any en-IN or hi-IN voice that is not male
          const indicFemale = voices.find(v => 
            (v.lang.startsWith('en-IN') || v.lang.startsWith('hi-IN') || v.name.toLowerCase().includes('india')) &&
            !isMale(v.name)
          );
          if (indicFemale) return indicFemale;

          // 2. High-quality Western Female voices (Samantha, Karen, Fiona, Victoria, Zira)
          const westernFemaleNames = ['samantha', 'karen', 'moira', 'fiona', 'tessa', 'victoria', 'zira', 'kathy', 'sandy', 'shelley', 'flo'];
          for (const target of westernFemaleNames) {
            const match = voices.find(v => v.name.toLowerCase().includes(target));
            if (match) return match;
          }

          // 3. Any voice containing "female"
          const anyFemale = voices.find(v => v.name.toLowerCase().includes('female'));
          if (anyFemale) return anyFemale;

          // 4. Any English voice that is not known to be male
          const nonMale = voices.find(v => v.lang.startsWith('en') && !isMale(v.name));
          if (nonMale) return nonMale;

          return null;
        }

        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.rate = 0.95; // Calm, conversational pace
        utter.pitch = 1.05; // Warm, natural female executive pitch
        utter.lang = 'en-IN';

        const femaleVoice = selectFemaleVoice();
        if (femaleVoice) {
          utter.voice = femaleVoice;
        }

        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('SpeechSynthesis error:', e);
      }
    };

    window.stopAgentSpeech = function() {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (_) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
