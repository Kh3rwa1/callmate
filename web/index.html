<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CallPilot – AI that calls, qualifies, and follows up for your business.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CallPilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CallPilot – Your AI Calling Employee</title>
  <link rel="manifest" href="manifest.json">
</head>
  <script>
    let activeAudioEl = null;

    window.playBase64Audio = function(base64Audio) {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if (!base64Audio) return;
        const audio = new Audio("data:audio/wav;base64," + base64Audio);
        activeAudioEl = audio;
        audio.play().catch(e => console.warn('Audio play error:', e));
      } catch (e) {
        console.warn('playBase64Audio error:', e);
      }
    };

    window.speakAgentText = function(text) {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        // De-dramatize: replace exclamation marks with neutral sentence endings
        const cleanText = (text || '').replace(/!+/g, '.').trim();
        if (!cleanText) return;

        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.rate = 0.92; // Calm, relaxed conversational pace
        utter.pitch = 0.88; // Grounded, executive pitch (avoids dramatic high-pitched squeakiness)
        utter.lang = 'en-IN';

        const voices = window.speechSynthesis.getVoices() || [];
        const preferredVoice = voices.find(v => v.lang.startsWith('en-IN') || v.name.includes('India')) ||
                               voices.find(v => v.lang.startsWith('en') && !v.name.includes('Zira') && !v.name.includes('David'));
        if (preferredVoice) {
          utter.voice = preferredVoice;
        }

        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('SpeechSynthesis error:', e);
      }
    };

    window.stopAgentSpeech = function() {
      try {
        if (activeAudioEl) {
          activeAudioEl.pause();
          activeAudioEl = null;
        }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (_) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
