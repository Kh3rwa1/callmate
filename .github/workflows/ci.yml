name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, callpilot ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Secret Scanning & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required by gitleaks-action for organization-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  flutter-client:
    name: Flutter Lint, Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Strict static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Verify coverage gate (ratchet; thresholds in tool/check_coverage.dart)
        # Plain `dart`, not `dart run`: the script only needs dart:io, and `dart run`
        # refuses packages with native build hooks (objective_c via path_provider_foundation).
        run: dart tool/check_coverage.dart

  cloudflare-backend:
    name: Cloudflare Worker Backend, Coverage & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Apply D1 migrations to a fresh local database
        # Same command production uses, so a broken migration fails here first.
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run unit & integration tests with coverage gate (thresholds in vitest.config.ts)
        run: npm run test:coverage

      - name: Initialize local dev environment variables for E2E
        run: |
          echo "ENVIRONMENT=development" > .dev.vars
          echo "JWT_SIGNING_KEY=test-jwt-signing-secret-key-32chars-min-length" >> .dev.vars
          echo "SARVAM_WEBHOOK_SECRET=dev_webhook_secret_key_12345" >> .dev.vars
          echo "SARVAM_API_KEY=sk_test_mock_sarvam_api_key" >> .dev.vars
          echo "OTP_PEPPER=ci-test-otp-pepper-secret-key-32chars-min" >> .dev.vars
          echo "ENCRYPTION_KEY=ci-test-encryption-key-secret-32chars-min" >> .dev.vars
          echo "SARVAM_ORG_ID=org_test" >> .dev.vars
          echo "SARVAM_WORKSPACE_ID=ws_test" >> .dev.vars
          echo "SARVAM_ADMISSIONS_APP_ID=app_test" >> .dev.vars

      - name: Run Cloudflare & Sarvam E2E tests
        run: npm test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend production dependencies (fails on high/critical)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Backend dev/test tooling (informational)
        # Dev-only advisories (e.g. undici inside @cloudflare/vitest-pool-workers)
        # never ship in the Worker bundle; surfaced here so they stay visible.
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Flutter outdated packages (informational)
        continue-on-error: true
        run: |
          flutter pub get
          flutter pub outdated

  android-release:
    name: Android Release Build (R8 + signing)
    runs-on: ubuntu-latest
    needs: flutter-client
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare signing and Firebase config
        id: cfg
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$GOOGLE_SERVICES_JSON" ] && [ -n "$PROD_ENV_JSON" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "$PROD_ENV_JSON" > "$RUNNER_TEMP/env.json"
            echo "shippable=true" >> "$GITHUB_OUTPUT"
          else
            # No release secrets: still prove the release pipeline (R8, resource
            # shrinking, Firebase plugins, signing) works, with throwaway inputs.
            echo "::notice ::Release secrets not configured; building a verification-only AAB."
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass cipass -keypass cipass \
              -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" >/dev/null
            printf 'storeFile=%s\nstorePassword=cipass\nkeyAlias=ci\nkeyPassword=cipass\n' "$RUNNER_TEMP/ci.jks" > android/key.properties
            cp .github/ci/google-services.ci.json android/app/google-services.json
            echo '{"APP_FLAVOR":"prod","API_BASE_URL":"https://api.callpilot.invalid","USE_MOCK":false,"DEMO_TOOLS":false}' > "$RUNNER_TEMP/env.json"
            echo "shippable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define-from-file="$RUNNER_TEMP/env.json" \
            --build-number=${{ github.run_number }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload signed AAB and symbols
        if: steps.cfg.outputs.shippable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: callpilot-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/symbols
          retention-days: 30
