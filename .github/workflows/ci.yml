name: CI

on:
  push:
    branches: [ main, callpilot ]
  pull_request:
    branches: [ main, callpilot ]

jobs:
  flutter-client:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

  cloudflare-backend:
    name: Cloudflare Worker Backend & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Initialize local D1 database schema
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Cloudflare & Sarvam E2E tests
        run: npm test
