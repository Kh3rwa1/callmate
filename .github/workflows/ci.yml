name: CI

on:
  push:
    branches: [ main, callpilot ]
  pull_request:
    branches: [ main, callpilot ]

jobs:
  security-audit:
    name: Secret Scanning & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter-client:
    name: Flutter Lint, Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Strict static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Verify domain & services coverage gate (>=60%)
        run: dart run tool/check_coverage.dart

  cloudflare-backend:
    name: Cloudflare Worker Backend, Coverage & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Initialize local D1 database schema
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run unit & integration tests with coverage gate (>=80% lines)
        run: npm run test:coverage

      - name: Initialize local dev environment variables for E2E
        run: |
          echo "ENVIRONMENT=development" > .dev.vars
          echo "JWT_SIGNING_KEY=test-jwt-signing-secret-key-32chars-min-length" >> .dev.vars
          echo "SARVAM_WEBHOOK_SECRET=dev_webhook_secret_key_12345" >> .dev.vars
          echo "SARVAM_API_KEY=sk_test_mock_sarvam_api_key" >> .dev.vars
          echo "OTP_PEPPER=ci-test-otp-pepper-secret-key-32chars-min" >> .dev.vars
          echo "ENCRYPTION_KEY=ci-test-encryption-key-secret-32chars-min" >> .dev.vars
          echo "SARVAM_ORG_ID=org_test" >> .dev.vars
          echo "SARVAM_WORKSPACE_ID=ws_test" >> .dev.vars
          echo "SARVAM_ADMISSIONS_APP_ID=app_test" >> .dev.vars

      - name: Run Cloudflare & Sarvam E2E tests
        run: npm test
