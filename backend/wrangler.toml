SARVAM_MAX_CONCURRENT_CALLS = "4"
# Built-in UPI payments while Razorpay is not set up (services/upi.ts): owners pay our UPI ID from any
# UPI app and enter the UTR; confirm them on the ops page. The UPI ID is a secret (it carries a phone
# number and this repo is public): `wrangler secret put UPI_PAYEE_VPA [--env staging]`. Unset = off
# (checkout offers "Email us"). Razorpay keys, when set as secrets, take over checkout.
UPI_PAYEE_NAME = "Tumdah"
