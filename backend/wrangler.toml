# Sarvam voice agent + caller IDs (not secret; SARVAM_API_KEY is a secret).
SARVAM_ORG_ID = "019fae1b-3a58-7997-a365-1ba8adec01b3"
SARVAM_WORKSPACE_ID = "019fae1b-3a5c-7830-94dc-9660d32abbf6"
