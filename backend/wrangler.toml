name = "callpilot-backend"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
JWT_SIGNING_KEY = "callpilot-super-secret-jwt-key-change-in-production"
SARVAM_PROXY_BASE = "https://apps.sarvam.ai/api/app-runtime"

[[d1_databases]]
binding = "DB"
database_name = "callpilot-db"
database_id = "local-d1-callpilot-db"

[[r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "callpilot-knowledge"
