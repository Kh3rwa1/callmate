SARVAM_CONNECTION_ID = "0da745db-ed-2dd19091-839b"
# Shared caller IDs for accounts without their own number (trial). +917971443028 is a business number.
SARVAM_AGENT_PHONE_NUMBERS = "+917971442975"
# agent_variables sent per dial. Unset = the 8 the agent declares (call_id,campaign_id,lead_id,
# lead_name,business_name,agent_name,agent_role,interest). Optional extras: business_context,
# call_language, gender, voice, speaker, language_code, tts_model. Sarvam rejects the WHOLE dial (422)
# for any name the agent version doesn't declare: declare it in the agent, commit a version, bump
# SARVAM_APP_VERSION, THEN list it here (docs/SARVAM_SETUP.md -> Agent variables). Example:
# SARVAM_AGENT_VARIABLES = "call_id,campaign_id,lead_id,lead_name,business_name,agent_name,agent_role,interest,business_context"
# AI + recording disclosure: 'true' makes every dial open with a fixed sentence ("this is <agent>, an AI
