name = "callpilot-backend"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
# Served on <name>.<account>.workers.dev. If you move to a custom domain, add a
# route here, set workers_dev = false and update API_BASE_URL in env/prod.json.
workers_dev = true

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
PUBLIC_API_BASE_URL = "https://callpilot-backend.dulalkisku0.workers.dev"
SARVAM_PROXY_BASE = "https://apps.sarvam.ai/api/app-runtime"
# Sarvam voice agent + caller IDs (not secret; SARVAM_API_KEY is a secret).
SARVAM_ORG_ID = "019fae1b-3a58-7997-a365-1ba8adec01b3"
SARVAM_WORKSPACE_ID = "019fae1b-3a5c-7830-94dc-9660d32abbf6"
# Greeting uses {{agent_name}} / {{business_name}}; the old agent (CallPilot---cb13b1d8-b8da) had Sarvam's sample "Shubh from Sarvam" hardcoded.
SARVAM_ADMISSIONS_APP_ID = "CallPilot---5f0b01d4-fdd9"
SARVAM_APP_VERSION = "1"
SARVAM_CONNECTION_ID = "0da745db-ed-2dd19091-839b"
# Shared caller IDs for accounts without their own number (trial). +917971443028 is a business number.
SARVAM_AGENT_PHONE_NUMBERS = "+917971442975"
# agent_variables sent per dial. Unset = the 8 the agent declares (call_id,campaign_id,lead_id,
# lead_name,business_name,agent_name,agent_role,interest). Optional extras: business_context,
# call_language, gender, voice, speaker, language_code, tts_model. Sarvam rejects the WHOLE dial (422)
# for any name the agent version doesn't declare: declare it in the agent, commit a version, bump
# SARVAM_APP_VERSION, THEN list it here (docs/SARVAM_SETUP.md -> Agent variables). Example:
# SARVAM_AGENT_VARIABLES = "call_id,campaign_id,lead_id,lead_name,business_name,agent_name,agent_role,interest,business_context"
# AI + recording disclosure: 'true' makes every dial open with a fixed sentence ("this is <agent>, an AI
# assistant calling from <business>... this call may be recorded") in the employee's first language,
# via Sarvam app_overrides.initial_bot_message (services/disclosure.ts). Leave unset until one staging
# test call to your own number confirms the agent accepts it (docs/SARVAM_SETUP.md -> Disclosure override).
# On: without it the agent opens with its own default greeting from the Sarvam dashboard.
SARVAM_DISCLOSURE_OVERRIDE = "true"
# Days to keep call transcripts, recordings and summaries before the cron clears them (default 180).
# RETENTION_DAYS = "180"
# Business numbers (docs/SARVAM_SETUP.md -> Business numbers): each paying business gets one; its AI
# calls from it and answers it. Entries are "+91…=<answering agent id>:<version>" (one agent per number;
# scripts/hook_url.mjs prints its hook URL). Empty = paying businesses tap "Request my number" and the
# operator is alerted to buy one. Never list a number that is also in SARVAM_AGENT_PHONE_NUMBERS.
# Older option: numbers bought now join the pool with no deploy (picked up by the cron or added on the
# ops page) and are answered by a receptionist pool agent, see below.
SARVAM_BUSINESS_NUMBERS = ""
# Receptionist pool (docs/SARVAM_SETUP.md -> Receptionist pool): copies of the receptionist agent whose
# on-start hook URL names the agent (?agent=<id>&token=<random>), not a number. A pool number (found by
# the cron or added on the ops page) takes a free one when a business rents it. Entries are
# "<agent id>:<version>:<sha256 hex of
# its hook token>" (scripts/hook_url.mjs --agent prints one). Add more when the ops alert
# receptionist_agents_low fires. Only hashes here; the tokens live in the agents' hook URLs.
SARVAM_RECEPTIONIST_AGENTS = """
CallPilot-R-2be151f5-6c80:2:2846436c94445d7ec735885da3a962eb4e8e6f9caa5ce141bc55974eeb046679,
CallPilot-R-2094f9fe-ce4c:2:17decbe1c1b8b65a8fc37b3c6b1b7a7cfc77356e1935876ba0a7e2e02dbec614,
CallPilot-R-75c12126-1809:2:851f610e841d6c0b01a32b8fd994230953d591f5a61880023cc639674bdc8d47,
CallPilot-R-58c9b600-bac5:2:5feba3e891dd87dab0f2fda85cc547d32dece40d729f3bd4544b043fc61fd5fd,
CallPilot-R-21949d71-564a:2:b3926eb04cccd62f2a44a3bac96aeaf313b3596a7bd6305408b3caeca535f762,
CallPilot-R-1398e4c7-b297:1:8034bd14a41860287f4817fd2799f746fd7421e125387ede4cf26d56703e264e,
CallPilot-R-925c9486-743d:2:50217039d471b1e1d1e14986002c8dd3bd41680956882b125e20421f490814ea,
CallPilot-R-5f2a42ea-95bd:2:2417b2079cac13d9ea1061962d3a0520a80d0326efc68004c236608541861b73
"""
# Ops page <PUBLIC_API_BASE_URL>/ops/numbers, where bought numbers are added: SHA-256 hex of its key
# (printf %s "$KEY" | shasum -a 256). Empty = the page is off (404).
OPS_KEY_SHA256 = "a5899083e982911bda43c6c15b0dd943e4275f00c4c00a3a44fb36704248fb90"
# "true" = only TRAI 140/160-series numbers join the business-number pool (the ops page refuses others).
# Off while our Vobiz numbers (+9179…) aren't DLT: they're added with a warning (COMPLIANCE.md).
# REQUIRE_DLT_CALLER_IDS = "true"
# Sarvam's organisation-wide concurrent call limit for our plan (pay-as-you-go 4, Pro 10, Growth 30).
# Dials wait for a free slot instead of being rejected. Raise it when the Sarvam plan changes.
SARVAM_MAX_CONCURRENT_CALLS = "4"
# Built-in UPI payments while Razorpay is not set up (services/upi.ts): owners pay our UPI ID from any
# UPI app and enter the UTR; confirm them on the ops page. The UPI ID is a secret (it carries a phone
# number and this repo is public): `wrangler secret put UPI_PAYEE_VPA [--env staging]`. Unset = off
# (checkout offers "Email us"). Razorpay keys, when set as secrets, take over checkout.
UPI_PAYEE_NAME = "Tumdah"
# Ops alerts: set the chat webhook as a secret, not here: `wrangler secret put ALERT_WEBHOOK_URL`.
FIREBASE_PROJECT_ID = "callpilot-app-c9b053"
# Shown on the public /legal pages. TODO(owner): set a monitored inbox and the registered company name.
SUPPORT_EMAIL = "founder@olitun.in"
LEGAL_ENTITY_NAME = "CallPilot"

# Migrations: `npm run db:migrate:prod` (wrangler d1 migrations apply).
# Demo seed data lives in ./seeds and is NEVER applied by migrations.
[[d1_databases]]
binding = "DB"
database_name = "callpilot-db"
database_id = "8e84cac9-2077-466e-8dd9-f1261d63d902"
migrations_dir = "migrations"

# Workers AI: powers the in-app "talk to your AI employee" chat.
[ai]
binding = "AI"

[[r2_buckets]]
binding = "KNOWLEDGE_BUCKET"
bucket_name = "callpilot-knowledge"

[[queues.producers]]
queue = "callpilot-campaign-dispatch"
binding = "CAMPAIGN_QUEUE"

[[queues.consumers]]
queue = "callpilot-campaign-dispatch"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 100
dead_letter_queue = "callpilot-campaign-dlq"

# Dead-letter consumer: marks campaign leads whose dispatch exhausted retries as failed.
[[queues.consumers]]
queue = "callpilot-campaign-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = ["*/10 * * * *"]

[env.staging]
name = "callpilot-backend-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
ENVIRONMENT = "staging"
PUBLIC_API_BASE_URL = "https://callpilot-backend-staging.dulalkisku0.workers.dev"
