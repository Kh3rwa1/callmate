name: callpilot
description: "CallPilot – Your AI Calling Employee. AI that calls, qualifies, and follows up for your business."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  permission_handler: ^11.4.0
  sarvamconv_ai_sdk: ^1.0.2
  google_fonts: ^8.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  timezone: ^0.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/
