name: callpilot
description: "CallPilot – Your AI Calling Employee. AI that calls, qualifies, and follows up for your business."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  permission_handler: ^11.4.0
  record: ^6.2.1
  sarvamconv_ai_sdk: ^1.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  flutter_contacts: ^2.6.0
  timezone: ^0.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cross_file: ^0.3.5+5

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Devanagari (Hindi) and Bengali fallbacks – see AppTheme.fontFallback.
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
          weight: 400
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
